name: CI

on:
  push:
    branches: [main, feat/terminal-experience]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} on Windows Server 2022
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python for native modules
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up MSVC build environment
        uses: ilammy/msvc-dev-cmd@v1
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Syntax checks and tests
        run: npm run check
