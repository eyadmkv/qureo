name: Bug report
description: Report a reproducible problem.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Do not include passwords, session cookies, student IDs, database files or private exports."
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the behavior and include a redacted error message.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: "1. Run ...\n2. Select ...\n3. See error ..."
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: "v24.3.0"
    validations:
      required: true
  - type: input
    id: powershell
    attributes:
      label: PowerShell version
      placeholder: "7.x"
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Include Windows version and relevant sanitized output.
